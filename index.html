    --border: #223350;

    --green: #3ECF8E;
    --green-soft: rgba(62,207,142,0.14);
    --amber: #F2B33D;
    --amber-soft: rgba(242,179,61,0.14);
    --purple: #B084F0;
    --purple-soft: rgba(176,132,240,0.14);
    --orange: #FF9F5A;
    --orange-soft: rgba(255,159,90,0.14);
    --red: #FF6B6B;
    --red-soft: rgba(255,107,107,0.14);
    --teal: #3ECF8E;
    --teal-soft: rgba(62,207,142,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 28px rgba(0,0,0,0.35);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {

    color: var(--ink);
    font-family: 'Cairo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;

  .shell { display: flex; min-height: 100dvh; min-height: 100vh; align-items: stretch; }
  .content-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  aside.sidebar {
    width: 232px; flex-shrink: 0; background: var(--bg-2);

    display: flex; flex-direction: column; gap: 18px;
    padding: 18px 14px calc(14px + env(safe-area-inset-bottom,0px));
    padding-top: calc(18px + env(safe-area-inset-top,0px));
    position: sticky; top: 0; height: 100dvh; height: 100vh; overflow-y: auto;
  }
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: rgba(12,23,40,0.7); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding-inline: 22px;
    padding-bottom: 14px;

  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .topbar-date { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin: 0 0 2px; }
  .topbar-title { font-size: 18px; font-weight: 800; margin: 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(155deg, var(--cyan), var(--green));
    display: flex; align-items: center; justify-content: center;
    color: #06121C; flex-shrink: 0; box-shadow: 0 0 0 4px rgba(62,198,224,0.12);
  }
  .brand-mark svg { width: 19px; height: 19px; }
  .brand-name { font-weight: 800; font-size: 15px; letter-spacing: 0; }
  .brand-sub { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
  .lang-btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
    border-radius: 8px; padding: 7px 12px; font-family: inherit; font-weight: 600;
    font-size: 13px; cursor: pointer;
  }
  .sidebar-nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .sidebar-nav button {
    display: flex; align-items: center; gap: 11px; border: none; background: none;
    color: var(--ink-soft); font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; padding: 11px 12px; border-radius: 11px; text-align: start;
    transition: background .15s ease, color .15s ease;
  }
  .sidebar-nav button:hover { background: var(--surface); color: var(--ink); }
  .sidebar-nav button svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar-nav button.active { color: var(--nav-color, var(--cyan)); background: var(--nav-color-soft, var(--cyan-soft)); }
  .sidebar-footer { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 14px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); flex-shrink: 0; }
  .sidebar-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); font-weight: 600; padding: 0 4px; }
  .icon-toggle-btn {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink-soft); display: inline-flex;
    align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .icon-toggle-btn svg { width: 17px; height: 17px; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  @media (max-width: 900px) {
    .shell { flex-direction: column; }
    aside.sidebar {
      width: 100%; height: auto; position: sticky; flex-direction: row; align-items: center;
      padding: 10px 12px; border-inline-end: none; border-bottom: 1px solid var(--border); gap: 10px;
      overflow-x: auto; z-index: 30;
    }
    .sidebar-brand { flex-shrink: 0; }
    .sidebar-nav { flex-direction: row; flex: 0 0 auto; }
    .sidebar-nav button { padding: 8px 12px; white-space: nowrap; }
    .sidebar-nav button span.label { display: none; }
    .sidebar-footer { flex-direction: row; border-top: none; padding-top: 0; flex-shrink: 0; margin-inline-start: auto; }
    .sidebar-status { display: none; }
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .card { animation: cardIn .45s cubic-bezier(.2,.7,.3,1) both; }
  .grid .card:nth-child(1){ animation-delay: .02s; } .grid .card:nth-child(2){ animation-delay: .07s; }
  .grid .card:nth-child(3){ animation-delay: .12s; } .grid .card:nth-child(4){ animation-delay: .17s; }
  .grid .card:nth-child(5){ animation-delay: .22s; } .grid .card:nth-child(6){ animation-delay: .27s; }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 10px 30px rgba(62,198,224,0.22), 0 0 0 0 rgba(62,198,224,0.25); }
    50% { box-shadow: 0 10px 34px rgba(62,198,224,0.34), 0 0 0 8px rgba(62,198,224,0); }
  }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; width: 100%; }
  .grid { display: grid; gap: 14px; }
  .grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 17px 18px; box-shadow: var(--shadow); border-inline-start: 3px solid transparent;
  }
  .card.clickable { cursor: pointer; transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease; }
  .card.clickable:hover { border-inline-start-color: var(--amber); box-shadow: 0 2px 4px rgba(35,40,31,0.08), 0 10px 26px rgba(35,40,31,0.08); }
  .card.clickable:active { transform: scale(0.99); }
  .card.accent-amber { border-inline-start-color: var(--amber); }
  .card.accent-teal { border-inline-start-color: var(--teal); }
  .card.hero {
    background: linear-gradient(160deg, #123B4E 0%, #0F2E3E 100%);
    color: #F4FAF7; border: 1px solid rgba(62,198,224,0.25);
    animation: cardIn .45s cubic-bezier(.2,.7,.3,1) both, glowPulse 3.2s ease-in-out infinite;
  }
  .card.hero .stat-label { color: rgba(244,250,247,0.75); }
  .card.hero .stat-value { color: #F4FAF7; }
  .stat-label { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin: 0 0 7px; }
  .stat-value { font-size: 27px; font-weight: 800; margin: 0; line-height: 1.15; letter-spacing: -0.3px; }
  .stat-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 26px 0 12px;
  }
  .section-head:first-child { margin-top: 0; }
  .section-head h2 { font-size: 17px; font-weight: 800; margin: 0; }
  .btn {
    border: none; border-radius: 9px; padding: 9px 15px; font-family: inherit;
    font-weight: 700; font-size: 13.5px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 6px;

  .btn-primary { background: var(--amber); color: #2A1B04; }
  .btn-outline { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); }
  .btn-danger { background: var(--red-soft); color: var(--red); }
  .btn-teal { background: var(--teal); color: #F3FAF6; }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 7px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px;
  }
  .pill-active { background: var(--teal-soft); color: var(--teal); }
  .pill-stopped { background: var(--surface-2); color: var(--ink-soft); }
  .pill-alert { background: var(--red-soft); color: var(--red); }
  .pill svg { width: 12px; height: 12px; }
  .alert-banner svg { width: 18px; height: 18px; flex-shrink: 0; }
  .station-card { display: flex; flex-direction: column; gap: 10px; }
  .station-card .row1 { display: flex; align-items: center; justify-content: space-between; }
  .station-name { font-size: 17px; font-weight: 800; }
  .mini-stats { display: flex; gap: 16px; }
  .mini-stats div p:first-child { font-size: 11.5px; color: var(--ink-soft); margin: 0; font-weight: 600; }
  .mini-stats div p:last-child { font-size: 15.5px; font-weight: 800; margin: 2px 0 0; }
  .empty-state {
    text-align: center; padding: 50px 20px; color: var(--ink-soft);
  }
  .empty-state .glyph { display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; width: 52px; height: 52px; border-radius: 14px; background: var(--surface-2); color: var(--ink-soft); }
  .empty-state .glyph svg { width: 24px; height: 24px; }
  .empty-state p { margin: 4px 0; font-size: 14px; }
  .back-link {

    cursor: pointer; padding: 0; margin-bottom: 14px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: start; color: var(--ink-soft); font-weight: 700; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; }
  .icon-btn {
    border: none; background: none; cursor: pointer; color: var(--ink-soft);

  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn:hover { background: var(--surface-2); color: var(--red); }
  /* modal */

    display: flex; align-items: flex-end; justify-content: center;

    max-height: 88vh; overflow-y: auto;

  @media (min-width: 640px) { .modal { border-radius: 18px; } }

  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 5px; }

  .field input:focus, .field select:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }

  .computed-box {

    display: flex; align-items: center; gap: 10px; background: var(--red-soft); color: var(--red);

  }
  .subtabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .subtabs button {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);

  }
  .subtabs button.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
 
  /* login screen */
  .login-wrap {
    min-height: 100dvh; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px calc(20px + env(safe-area-inset-right,0px)) 24px calc(20px + env(safe-area-inset-left,0px));
    background: radial-gradient(circle at 30% 15%, var(--amber-soft), transparent 55%),
                radial-gradient(circle at 80% 85%, var(--teal-soft), transparent 55%),
                var(--bg);
  }
  .login-card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 30px 26px; box-shadow: var(--shadow);
  }
  .login-mark {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(155deg, var(--amber), var(--teal));
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
  }
  .login-mark svg { width: 26px; height: 26px; color: #fff; }
  .login-card h1 { font-size: 19px; font-weight: 800; margin: 0 0 4px; }
  .login-card .sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 22px; }
  .login-error {
    background: var(--red-soft); color: var(--red); border-radius: 9px; padding: 9px 12px;
    font-size: 13px; font-weight: 700; margin-bottom: 14px; display: none;
  }
  .login-error.show { display: block; }
</style>
</head>

  } catch(e){ return defaultState(); }
}

/* ---------- derived calcs ---------- */
function stationTotals(st){
  const eggs = st.batches.reduce((s,b)=>s+Number(b.eggs||0),0);
  const chicks = st.batches.reduce((s,b)=>s+Number(b.chicks||0),0);
  const rate = eggs > 0 ? (chicks/eggs*100) : 0;
  return { eggs, chicks, rate };
}
function overallTotals(){
  const active = state.stations.filter(s=>s.active);
  const eggs = active.reduce((s,st)=>s+stationTotals(st).eggs,0);
  const chicks = active.reduce((s,st)=>s+stationTotals(st).chicks,0);
  const rate = eggs > 0 ? (chicks/eggs*100) : 0;
  return { activeCount: active.length, eggs, chicks, rate };
}
function medicineStock(m){
  const supplied = m.supplies.reduce((s,x)=>s+Number(x.bottles||0),0);
  const used = m.consumption.reduce((s,x)=>s+Number(x.bottlesUsed||0),0);
  const remainingBottles = supplied - used;
  const remainingDoses = remainingBottles * Number(m.dosesPerBottle||0);
  return { remainingBottles, remainingDoses, lowStock: remainingDoses <= Number(m.alertThreshold||0) };
}
function fmt(n){ return Number(n||0).toLocaleString(state.lang === "ar" ? "ar-EG" : "en-US"); }
function fmt1(n){ return Number(n||0).toLocaleString(state.lang === "ar" ? "ar-EG" : "en-US", {maximumFractionDigits:1}); }
 
/* ---------- modal system ---------- */
function openModal(html){
  document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
 
/* ---------- render root ---------- */
function animateCounters(){
  document.querySelectorAll('.count-up').forEach(el=>{
    if (el.dataset.animated) return;
    el.dataset.animated = "1";
    const target = parseFloat(el.dataset.target||"0");
    const decimals = parseInt(el.dataset.decimals||"0",10);
    const suffix = el.dataset.suffix || "";
    const duration = 750;
    const start = performance.now();
    function frame(now){
      const p = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      const val = target*eased;
      el.textContent = (decimals>0 ? fmt1(val) : fmt(Math.round(val))) + suffix;
      if (p<1) requestAnimationFrame(frame);
      else el.textContent = (decimals>0 ? fmt1(target) : fmt(target)) + suffix;
    }
    requestAnimationFrame(frame);
  });
}
function render(){
  renderTabs();
  const app = document.getElementById("app");
  if (state.tab === "dashboard") app.innerHTML = renderDashboard();
  else if (state.tab === "stations") app.innerHTML = state.openStationId ? renderStationDetail() : renderStationsList();
  else if (state.tab === "medicines") app.innerHTML = state.openMedicineId ? renderMedicineDetail() : renderMedicinesList();
  else if (state.tab === "nitrogen") app.innerHTML = renderNitrogen();
  else if (state.tab === "workers") app.innerHTML = renderWorkers();
  else if (state.tab === "inventory") app.innerHTML = renderInventory();
  animateCounters();
}

/* ================= NITROGEN ================= */
function renderNitrogen(){
  const n = state.nitrogen;
  const usedTotal = n.logs.reduce((s,l)=>s+Number(l.used||0),0);
  const remaining = Number(n.fillAmount||0) - usedTotal;
  const avgDaily = n.logs.length ? (usedTotal / n.logs.length) : 0;
  const daysLeft = avgDaily > 0 ? (remaining/avgDaily) : null;
  const low = daysLeft !== null && daysLeft <= Number(n.alertLevel||0);
  return `
    <div class="section-head"><h2>${t('nitrogenTitle')}</h2>
      <button class="btn btn-primary btn-sm" onclick="showAddNitrogenUsageModal()">+ ${t('addUsage')}</button>
    </div>
    ${low ? `<div class="alert-banner">${icon('warn')} ${t('lowStockAlert')}</div>` : ""}
    <div class="grid cols-3">
      <div class="card"><p class="stat-label">${t('remainingStock')}</p><p class="stat-value">${fmt1(remaining)}</p></div>
      <div class="card"><p class="stat-label">${t('daysLeft')}</p><p class="stat-value">${daysLeft!==null?fmt1(daysLeft):'—'}</p></div>
      <div class="card">
        <p class="stat-label">${t('fillAmount')} / ${t('alertLevel')}</p>
        <div style="display:flex;gap:8px;margin-top:6px;">
          <input id="f_fill" type="number" value="${n.fillAmount}" style="width:50%;padding:7px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-family:inherit;">
          <input id="f_alertlvl" type="number" value="${n.alertLevel}" style="width:50%;padding:7px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-family:inherit;">
        </div>
        <button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%;justify-content:center;" onclick="saveNitrogenSettings()">${t('save')}</button>
      </div>
    </div>
    <div class="section-head"><h2>${t('dailyUsage')}</h2></div>
    ${n.logs.length===0 ? emptyState(icon('nitrogen'), t('noDataYet')) : `
      <div class="card table-wrap">
        <table><thead><tr><th>${t('date')}</th><th>${t('dailyUsage')}</th><th></th></tr></thead>
        <tbody>
          ${[...n.logs].reverse().map(l=>`
            <tr><td>${escapeHtml(l.date)}</td><td>${fmt1(l.used)}</td>
            <td><button class="icon-btn" onclick="deleteNitrogenLog('${l.id}')">${icon('trash')}</button></td></tr>`).join("")}
        </tbody></table>
      </div>
    `}
  `;
}
function saveNitrogenSettings(){
  state.nitrogen.fillAmount = Number(document.getElementById("f_fill").value||0);
  state.nitrogen.alertLevel = Number(document.getElementById("f_alertlvl").value||0);
  persist(); render();
}

    <div class="field"><label>${t('dailyUsage')}</label><input id="f_used" type="number" min="0" step="0.1"></div>

/* ================= WORKERS ================= */
function addDays(dateStr, days){
  const d = new Date(dateStr); d.setDate(d.getDate()+Number(days||0));
  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function renderWorkers(){
  return `
    <div class="section-head"><h2>${t('workersTitle')}</h2>
      <button class="btn btn-primary btn-sm" onclick="showAddWorkerModal()">+ ${t('addWorker')}</button>

          <th>${t('expectedReturn')}</th><th>${t('actualReturn')}</th><th>${t('daysBack')}</th><th></th>
        </tr></thead>
        <tbody>
          ${state.workers.map(w=>{
            const expected = w.vacationStart ? addDays(w.vacationStart, w.vacationDays) : "—";

            return `<tr>
              <td>${escapeHtml(w.name)}</td><td>${escapeHtml(w.fileNo)}</td><td>${escapeHtml(w.vacationStart||"—")}</td>
              <td>${expected}</td><td>${escapeHtml(w.actualReturn||t('notReturned'))}</td>
              <td>${daysBack!==null?fmt(daysBack):'—'}</td>
              <td><button class="icon-btn" onclick="deleteWorker('${w.id}')">${icon('trash')}</button></td>

      </div>
